[project]
name = "cim-to-linkml"
version = "2.0.0"
description = ""
authors = [{ name = "Bart Kleijngeld", email = "bartkl@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "lxml>=5.0.0",
    "rdflib>=7.6.0",
]

[project.scripts]
cim2linkml = "cim_to_linkml.main:cli"

[dependency-groups]
dev = [
    "isort>=5.13.2",
    "pyright>=1.1.356",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
